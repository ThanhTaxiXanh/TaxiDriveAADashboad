name: taxi_driver_aa_dashboard
description: Thử nghiệm Flutter trực tiếp trên bề mặt Android Auto.
publish_to: none
version: 0.4.1+1
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  maplibre_flutter_gpu: 0.2.0
  flutter_map: 8.3.2
  flutter_map_vector_tiles: 2.10.1
  latlong2: ^0.9.1
  http: ^1.5.0
  qr_flutter: 4.1.0
  zxing2: 0.2.4
  image: ^4.5.4
  image_picker: 1.2.4
  flutter_localizations:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/licenses/MAPLIBRE_NATIVE_NOTICES.md
    - assets/fonts/OFL.txt
    - assets/events_vn.json
    - assets/banks_vn.json
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
