name: Vietnam offline road data
on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:
  push:
    branches: [main, 'feat/phase-5-road-data']
    paths: ['tools/road_data/**', '.github/workflows/data-pack.yml']
concurrency:
  group: road-data-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - run: pip install osmium==4.3.2
      - run: python3 tools/road_data/test_pack.py
      - name: Select month and reuse validated candidate on main
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          mkdir -p build/road-data
          if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
            gh release download road-data-candidate --dir build/road-data --clobber || true
          fi
          python3 tools/road_data/reuse_candidate.py
      - uses: actions/cache/restore@v4.2.3
        if: steps.reuse.outputs.reuse != 'true'
        id: pbf
        with:
          path: data-cache
          key: vietnam-public-pbf-${{ steps.reuse.outputs.month }}
      - run: python3 tools/road_data/download_pbf.py
        if: steps.reuse.outputs.reuse != 'true'
      - uses: actions/cache/save@v4.2.3
        if: steps.reuse.outputs.reuse != 'true' && steps.pbf.outputs.cache-hit != 'true'
        with:
          path: data-cache
          key: vietnam-public-pbf-${{ steps.reuse.outputs.month }}
      - name: Build bounded, indexed offline database
        if: steps.reuse.outputs.reuse != 'true'
        run: python3 tools/road_data/build_pack.py data-cache/vietnam.osm.pbf build/road-data/vietnam-roads.sqlite
      - name: Validate compressed payload and SQLite contract
        run: python3 tools/road_data/validate_output.py build/road-data
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: vietnam-road-data
          path: |
            build/road-data/*.gz
            build/road-data/manifest.json
            build/road-data/LICENSE.txt
          retention-days: 30
      - name: Publish ODbL database separately from APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
            pack_tag=road-data
          else
            pack_tag=road-data-candidate
          fi
          if ! gh release view "$pack_tag" >/dev/null 2>&1; then
            gh release create "$pack_tag" --target "$GITHUB_SHA" --prerelease --title 'Dữ liệu đường Việt Nam · OSM/ODbL' --notes-file build/road-data/LICENSE.txt
          fi
          gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$pack_tag" -f sha="$GITHUB_SHA" -F force=true
          gh release upload "$pack_tag" build/road-data/*.gz build/road-data/manifest.json build/road-data/LICENSE.txt --clobber
