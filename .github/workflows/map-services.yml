name: Public map service probes
on:
  workflow_dispatch:
  push:
    branches: ['feat/phase-4-navigation']
    paths: ['tools/map_smoke.py', '.github/workflows/map-services.yml']
permissions:
  contents: read
jobs:
  services:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2
      - run: python3 tools/map_smoke.py
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: map-service-availability
          path: map-services-report.json
          if-no-files-found: error
