name: CI
on:
  push:
    branches: [main, dev, 'feat/**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  format_sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: subosito/flutter-action@v2.21.0
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
      - run: flutter pub get
      - name: Format sources
        run: |
          if ! dart format --output=none --set-exit-if-changed lib test tools/ui_preview_test.dart tools/youtube_spike.dart; then
            python3 tools/show_format.py
            exit 1
          fi
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2.21.0
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
      - run: python3 tools/test_signing.py
      - run: python3 tools/road_data/test_pack.py
      - run: bash tools/bootstrap_android.sh
      - run: flutter pub get
      - run: python3 tools/report_dependencies.py
      - name: Check formatting
        id: formatting
        continue-on-error: true
        run: |
          if ! dart format --output=none --set-exit-if-changed lib test tools/ui_preview_test.dart tools/youtube_spike.dart; then
            python3 tools/show_format.py
            exit 1
          fi
      - run: flutter analyze
      - name: Native SQLite R-tree contract
        run: |
          python3 tools/build_road_fixture.py
          bash android/gradlew -p tools/road_jvm test --no-daemon
      - run: flutter test --coverage
      - name: Public YouTube extractor spike
        if: github.event_name != 'pull_request'
        continue-on-error: true
        timeout-minutes: 2
        run: dart run tools/youtube_spike.dart
      - name: Export first-review golden previews
        timeout-minutes: 3
        run: flutter test tools/ui_preview_test.dart --update-goldens
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: ui-previews
          path: build/previews/*.png
          if-no-files-found: error
      - name: Configure personal signing if available
        if: github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 tools/configure_signing.py
      - name: MediaSession and media button Android contract
        run: bash android/gradlew :app:testDebugUnitTest --no-daemon
      - name: Build diagnostic APK
        run: flutter build apk --debug --build-number=${{ github.run_number }}
      - name: Require formatted sources
        if: steps.formatting.outcome != 'success'
        run: exit 1
      - name: Build signed release APKs
        if: env.HAS_SIGNING == 'true'
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}
      - name: Verify native 3D payload
        run: python3 tools/verify_gpu_apk.py
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: diagnostics-and-tests
          path: |
            formatter-output.txt
            build/youtube-spike.json
            coverage/
            pubspec.lock
          retention-days: 30
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: dashboard-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Stage signed APKs
        if: env.HAS_SIGNING == 'true'
        run: |
          mkdir -p signed-apks
          cp build/app/outputs/flutter-apk/*-release.apk signed-apks/
      - uses: actions/upload-artifact@v4.6.2
        if: env.HAS_SIGNING == 'true'
        with:
          name: signed-apks
          path: signed-apks/*.apk
      - name: Signing status
        if: env.HAS_SIGNING != 'true'
        run: echo 'Chưa có khóa ký ổn định. APK debug chỉ để thử; chưa đạt cổng Giai đoạn 0.' >> "$GITHUB_STEP_SUMMARY"
  nightly:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build, format_sources]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        id: signed
        continue-on-error: true
        with:
          name: signed-apks
          path: signed-apks
      - name: Publish only signed personal APKs
        if: steps.signed.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if ! gh release view nightly >/dev/null 2>&1; then
            gh release create nightly --target "$TARGET_SHA" --prerelease --title 'Giai đoạn 6 · Nhạc và YouTube v0.6.1' --notes 'v0.6.1: bổ sung phiên hàng đợi và phím media chuẩn Android Auto/vô lăng; nhường quyền phím cho app nhạc khi đổi nguồn. Thêm client YouTube tương thích và kiểm tra byte media, fallback video360p. Âm thanh tiếp tục khi di chuyển; giữ khóa hình khi xe chạy hoặc GPS không tin cậy.'
          fi
          gh api --method PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$TARGET_SHA" -F force=true
          gh release edit nightly --prerelease --title 'Giai đoạn 6 · Nhạc và YouTube v0.6.1' --notes 'v0.6.1: sửa phím vô lăng/trước-sau cho hàng đợi YouTube và trả quyền nhận phím về app nhạc được chọn khi đổi nguồn. Thêm client YouTube tương thích, kiểm tra dữ liệu media trước phát và fallback video360p nếu cần. Mở Nhạc và YouTube, cấp Truy cập thông báo để điều khiển app nhạc. Âm thanh vẫn phát khi di chuyển; hình chỉ xem khi đỗ và GPS tin cậy. Cần kiểm tra phím VF e34 và phát YouTube trên Redmi thực tế; không bảo đảm mọi video/mạng.'
          gh release upload nightly signed-apks/*.apk --clobber
